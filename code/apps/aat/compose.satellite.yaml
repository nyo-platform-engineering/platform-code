# Overlay P4: Feed Satelit lokal untuk pengembangan tanpa token asisten.
# docker compose -p aat-part1 -f compose.yaml -f compose.client.yaml -f compose.satellite.yaml up -d --build
# Mock ini meniru antarmuka Feed Satelit; bentuk payload-nya masih asumsi sampai dicek ke feed asli.
services:
  satellite:
    build:
      context: .
      dockerfile: satellite/Dockerfile
    environment:
      SATELLITE_GROUP_TOKEN: ${SATELLITE_GROUP_TOKEN:-local-satellite-token}
      SPEED: ${SATELLITE_MOCK_SPEED:-1}
      SEED: ${SATELLITE_MOCK_SEED:-4031}
      PASS_INTERVAL_SECONDS: ${SATELLITE_MOCK_PASS_INTERVAL_SECONDS:-120}
      DETECTIONS_PER_PASS: ${SATELLITE_MOCK_DETECTIONS_PER_PASS:-40}
      DROP_AFTER_SECONDS: ${SATELLITE_MOCK_DROP_AFTER_SECONDS:-0}
    ports: ["127.0.0.1:${SATELLITE_MOCK_PORT:-8087}:8087"]
    networks: [services]
  aggregator:
    environment:
      SATELLITE_FEED_URL: http://satellite:8087
      SATELLITE_GROUP_TOKEN: ${SATELLITE_GROUP_TOKEN:-local-satellite-token}
    depends_on:
      satellite:
        condition: service_started
