services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - canonical-data:/var/lib/postgresql/data
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 20
  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      DATABASE_URL: "host=postgres user=${POSTGRES_USER:?required} password=${POSTGRES_PASSWORD:?required} dbname=${POSTGRES_DB:?required} sslmode=disable"
      AGGREGATOR_TOKEN: ${AGGREGATOR_TOKEN:?required}
      AUDIT_TOKEN: ${AUDIT_TOKEN:-}
      STORE_NODE_NAME: ${STORE_NODE_NAME:-}
      STORE_UNIT: ${STORE_UNIT:-postgres}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-8}
      BMKG_URL: http://bmkg:8081
      BMKG_API_KEY: ${BMKG_API_KEY:?required}
      PVMBG_URL: http://pvmbg:8082
      PVMBG_TOKEN: ${PVMBG_TOKEN:?required}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-3}
      POLL_TIMEOUT_MS: ${POLL_TIMEOUT_MS:-4000}
      PVMBG_SCHEMA_POLICY: ${PVMBG_SCHEMA_POLICY:-strict}
      FIELD_REPORT_PROCESSOR_ENABLED: ${FIELD_REPORT_PROCESSOR_ENABLED:-true}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      # Feed Satelit (P4); token grup dari asisten di .env, kosong = consumer mati.
      SATELLITE_FEED_URL: ${SATELLITE_FEED_URL:-https://satellite.naufarrel.dev}
      SATELLITE_GROUP_TOKEN: ${SATELLITE_GROUP_TOKEN:-}
      SATELLITE_ALLOWED_LATENESS_MINUTES: ${SATELLITE_ALLOWED_LATENESS_MINUTES:-360}
      SATELLITE_BATCH_SIZE: ${SATELLITE_BATCH_SIZE:-200}
      # Sensor Pantai (P5); kosong = poller sensor mati.
      SENSOR_PANTAI_URL: http://sensor-pantai:8080
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:-}
      SENSOR_POLL_INTERVAL_MS: ${SENSOR_POLL_INTERVAL_MS:-1000}
      SENSOR_TIMEOUT_MS: ${SENSOR_TIMEOUT_MS:-2000}
      SENSOR_STALE_AFTER_SECONDS: ${SENSOR_STALE_AFTER_SECONDS:-900}
    ports: ["127.0.0.1:${AGGREGATOR_PORT:-8083}:8083"]
    networks: [services, storage]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
  bmkg:
    build:
      context: .
      dockerfile: bmkg/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      BMKG_API_KEY: ${BMKG_API_KEY:?required}
      BMKG_DELAY_MS: ${BMKG_DELAY_MS:-100}
      START_TIME: ${START_TIME:?run scripts/setup-env.py first}
      EVENT_INTERVAL_SECONDS: ${EVENT_INTERVAL_SECONDS:-10}
    ports: ["127.0.0.1:${BMKG_PORT:-8081}:8081"]
    networks: [services]
  pvmbg:
    build:
      context: .
      dockerfile: pvmbg/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      PVMBG_TOKEN: ${PVMBG_TOKEN:?required}
      PVMBG_DELAY_MIN_MS: ${PVMBG_DELAY_MIN_MS:-500}
      PVMBG_DELAY_MAX_MS: ${PVMBG_DELAY_MAX_MS:-3000}
      START_TIME: ${START_TIME:?run scripts/setup-env.py first}
      EVENT_INTERVAL_SECONDS: ${EVENT_INTERVAL_SECONDS:-10}
    ports: ["127.0.0.1:${PVMBG_PORT:-8082}:8082"]
    networks: [services]
  nats:
    image: nats:2.11-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    networks: [services]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 2s
      retries: 20
  dashboard-updater:
    build:
      context: .
      dockerfile: consumers/dashboard-updater/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      PORT: "8085"
    networks: [services]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8085/health]
      interval: 5s
      timeout: 2s
      retries: 10
  # Image asisten, tidak dimodifikasi; port tidak dipublikasikan ke host.
  sensor-pantai:
    image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
    environment:
      PANTAI_PROFILE: ${PANTAI_PROFILE:-practice}
      PANTAI_SEED: ${PANTAI_SEED:-42}
      PANTAI_SPEED: ${PANTAI_SPEED:-60}
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:?run scripts/setup-env.py first}
    networks: [services]
  field-notifier:
    build:
      context: .
      dockerfile: consumers/field-notifier/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      PORT: "8086"
    networks: [services]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8086/health]
      interval: 5s
      timeout: 2s
      retries: 10

networks:
  services:
  storage:
    internal: true
volumes:
  canonical-data:
  nats-data:
