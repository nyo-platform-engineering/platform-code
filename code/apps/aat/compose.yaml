services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - canonical-data:/var/lib/postgresql/data
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 20
  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    environment:
      DATABASE_URL: "host=postgres user=${POSTGRES_USER:?required} password=${POSTGRES_PASSWORD:?required} dbname=${POSTGRES_DB:?required} sslmode=disable"
      AGGREGATOR_TOKEN: ${AGGREGATOR_TOKEN:?required}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-5}
      BMKG_URL: http://bmkg:8081
      BMKG_API_KEY: ${BMKG_API_KEY:?required}
      PVMBG_URL: http://pvmbg:8082
      PVMBG_TOKEN: ${PVMBG_TOKEN:?required}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-3}
      POLL_TIMEOUT_MS: ${POLL_TIMEOUT_MS:-4000}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    ports: ["127.0.0.1:${AGGREGATOR_PORT:-8083}:8083"]
    networks: [services, storage]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
  bmkg:
    build:
      context: .
      dockerfile: bmkg/Dockerfile
    environment:
      BMKG_API_KEY: ${BMKG_API_KEY:?required}
      BMKG_DELAY_MS: ${BMKG_DELAY_MS:-100}
      EVENT_INTERVAL_SECONDS: ${EVENT_INTERVAL_SECONDS:-10}
    ports: ["127.0.0.1:${BMKG_PORT:-8081}:8081"]
    networks: [services]
  pvmbg:
    build:
      context: .
      dockerfile: pvmbg/Dockerfile
    environment:
      PVMBG_TOKEN: ${PVMBG_TOKEN:?required}
      PVMBG_DELAY_MIN_MS: ${PVMBG_DELAY_MIN_MS:-500}
      PVMBG_DELAY_MAX_MS: ${PVMBG_DELAY_MAX_MS:-3000}
      EVENT_INTERVAL_SECONDS: ${EVENT_INTERVAL_SECONDS:-10}
    ports: ["127.0.0.1:${PVMBG_PORT:-8082}:8082"]
    networks: [services]
  nats:
    image: nats:2.11-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    networks: [services]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8222/health"]
      interval: 3s
      timeout: 2s
      retries: 20
  dashboard-updater:
    build:
      context: .
      dockerfile: consumers/dashboard-updater/Dockerfile
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      PORT: "8085"
    networks: [services]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8085/health]
      interval: 5s
      timeout: 2s
      retries: 10
  field-notifier:
    build:
      context: .
      dockerfile: consumers/field-notifier/Dockerfile
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      PORT: "8086"
    networks: [services]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8086/health]
      interval: 5s
      timeout: 2s
      retries: 10

networks:
  services:
  storage:
    internal: true
volumes:
  canonical-data:
  nats-data:
