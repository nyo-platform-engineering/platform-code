version: '3'
tasks:
  dev:
    desc: Run native Go apps and Vite with Docker telemetry dependencies
    cmds:
      - python3 '{{.TASKFILE_DIR}}/dev/manage.py' run
  dev:setup:
    desc: Install native dependencies and validate the Collector configuration
    cmds:
      - python3 '{{.TASKFILE_DIR}}/dev/manage.py' setup
  dev:stop:
    desc: Stop the app supervisor and dependencies it started, preserving telemetry
    cmds:
      - python3 '{{.TASKFILE_DIR}}/dev/manage.py' stop
  dev:status:
    desc: Show native app PIDs, URLs, health, source/log paths, and Docker containers
    cmds:
      - python3 '{{.TASKFILE_DIR}}/dev/manage.py' status
  dev:bot:
    desc: Generate randomized demo telemetry natively (Ctrl-C stops; --count/--interval/--seed supported)
    cmds:
      - python3 '{{.TASKFILE_DIR}}/dev/traffic.py' {{.CLI_ARGS}}
  dev:smoke:
    desc: Verify demo actions reach ClickHouse and the trace/log API
    cmds:
      - python3 '{{.TASKFILE_DIR}}/dev/manage.py' smoke
  dev:reset:
    desc: Delete the local telemetry volume and stop development processes
    cmds:
      - python3 '{{.TASKFILE_DIR}}/dev/manage.py' reset
  dev:integration:
    desc: Test live ClickHouse isolation and permissions (Compose must be running)
    dir: '{{.TASKFILE_DIR}}/telemetry-ui/backend'
    env:
      CLICKHOUSE_INTEGRATION: '1'
    cmds:
      - go test -run Integration -v
  dev:test:
    desc: Test Go applications and build/typecheck the frontend natively
    cmds:
      - task: go-demo-test-native
      - task: telemetry-api-test-native
      - task: telemetry-web-test-native
  go-demo-test-native:
    dir: '{{.TASKFILE_DIR}}/go-demo'
    cmds:
      - go test ./...
      - go vet ./...
  telemetry-api-test-native:
    dir: '{{.TASKFILE_DIR}}/telemetry-ui/backend'
    cmds:
      - go test ./...
      - go vet ./...
  telemetry-web-test-native:
    dir: '{{.TASKFILE_DIR}}/telemetry-ui/frontend'
    cmds:
      - pnpm format:check
      - pnpm test
      - pnpm build
  telemetry-ui-test:
    desc: Install/build the telemetry UI with pnpm and test/vet its Go API in containers
    dir: '{{.TASKFILE_DIR}}/telemetry-ui'
    cmds:
      - docker build --target web-build --tag local/telemetry-ui-web-test .
      - docker build --target go-build --tag local/telemetry-ui-go-test .
  telemetry-ui-build:
    desc: Build the initial Go and React telemetry UI image
    dir: '{{.TASKFILE_DIR}}/telemetry-ui'
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG | default "dev1"}}'
    cmds:
      - docker build --tag "local/telemetry-ui:{{.IMAGE_TAG}}" .
  go-demo:
    desc: Build, save, import into k3d, and restart the Go demo
    dir: '{{.TASKFILE_DIR}}/go-demo'
    vars:
      CLUSTER_NAME: '{{.CLUSTER_NAME | default "dev"}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default "dev1"}}'
      IMAGE: 'local/go-demo:{{.IMAGE_TAG}}'
      ARCHIVE: 'go-demo-{{.IMAGE_TAG}}.tar'
      NODE_ARCH:
        sh: 'kubectl --context "k3d-{{.CLUSTER_NAME}}" get nodes -o jsonpath="{.items[0].status.nodeInfo.architecture}"'
    cmds:
      - docker build --platform "linux/{{.NODE_ARCH}}" --tag "{{.IMAGE}}" .
      - docker image save --output "{{.ARCHIVE}}" "{{.IMAGE}}"
      - k3d image import "{{.IMAGE}}" --cluster "{{.CLUSTER_NAME}}"
      - 'CLUSTER_NAME="{{.CLUSTER_NAME}}" IMAGE_TAG="{{.IMAGE_TAG}}" bash ../../infrastructure/scripts/gitlab.sh local-image'
      - kubectl --context "k3d-{{.CLUSTER_NAME}}" rollout restart deployment/go-demo --namespace dev
      - kubectl --context "k3d-{{.CLUSTER_NAME}}" rollout status deployment/go-demo --namespace dev --timeout=45s
