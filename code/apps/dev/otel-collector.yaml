receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  resource/local:
    attributes:
      - key: tenant.id
        value: local
        action: upsert
      - key: deployment.environment.name
        value: local
        action: upsert

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4&enable_json_type=1
    database: otel
    username: otelcollector
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: true
    ttl: 24h
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    timeout: 5s
    sending_queue:
      enabled: true
      sizer: items
      queue_size: 4096
      num_consumers: 1
      batch:
        min_size: 256
        max_size: 512
        flush_timeout: 1s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/local]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/local]
      exporters: [clickhouse]
