nameOverride: ""
fullnameOverride: ""
replicaCount: 1
image:
  repository: telemetry-ui
  tag: "" # Defaults to appVersion; set to your published image tag.
  digest: "" # Optional sha256 digest takes precedence over tag.
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Only local auth is implemented. Secure external access at your gateway.
authMode: local
clickhouse:
  type: unified # unified | split
  # Used only when type=unified.
  unified:
    address: clickhouse:9000
    username: app
    passwordSecret:
      name: telemetry-ui-clickhouse
      key: password
  # Used only when type=split. Both connections must be complete.
  # Passwords reference existing Secrets.
  traces:
    address: ""
    username: ""
    passwordSecret: {}
  logs:
    address: ""
    username: ""
    passwordSecret: {}
service:
  port: 8080
  annotations: {}
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  annotations: {}
# Kubernetes EnvVar entries; use for OTEL_* settings and Secret references.
# Managed PORT/LISTEN_HOST/WEB_DIST_DIR/AUTH_MODE/CLICKHOUSE_* names are rejected.
extraEnv: []
podAnnotations: {}
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
startupProbe:
  httpGet: {path: /healthz, port: http}
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30
livenessProbe:
  httpGet: {path: /healthz, port: http}
  periodSeconds: 10
  timeoutSeconds: 2
readinessProbe:
  httpGet: {path: /readyz, port: http}
  periodSeconds: 10
  timeoutSeconds: 5 # Backend checks have a three-second deadline.
  failureThreshold: 3
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
