default:
  image: golang:1.27.1-alpine
  tags: [kubernetes]
  interruptible: true

stages: [lint, test, build, deploy]

lint:
  stage: lint
  script:
    - cd backend
    - test -z "$(gofmt -l .)"
    - go vet ./...

test:
  stage: test
  script:
    - cd backend
    - go test ./...

web:
  stage: test
  image: node:24-alpine
  script:
    - npm install --global pnpm@12.6.0
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm test
    - pnpm build
  artifacts:
    paths: [frontend/dist/]
    expire_in: 1 day

chart:
  stage: test
  image:
    name: alpine/helm:3.19.0
    entrypoint: [""]
  script:
    - helm lint helm
    - helm lint helm -f helm/examples/split.yaml

build:
  stage: build
  variables:
    CGO_ENABLED: '0'
  script:
    - mkdir -p dist/root/web dist/root/etc/ssl/certs
    - cd backend && go build -trimpath -ldflags="-s -w" -o ../dist/root/telemetry-ui . && cd ..
    - cp -R frontend/dist/. dist/root/web/
    - apk add --no-cache ca-certificates
    - cp /etc/ssl/certs/ca-certificates.crt dist/root/etc/ssl/certs/
    # Package the binary, web assets, and CA bundle without privileged jobs.
    - go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
    - export DOCKER_CONFIG="$(mktemp -d)"
    - trap 'rm -rf "$DOCKER_CONFIG"' EXIT
    - printf '%s' "$CI_REGISTRY_PASSWORD" | crane auth login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin --insecure
    - tar -C dist/root -cf dist/layer.tar .
    - crane append --oci-empty-base --new_layer dist/layer.tar --new_tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --insecure
    - crane mutate "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --entrypoint /telemetry-ui --env WEB_DIST_DIR=/web --env PORT=8080 --user 65532:65532 --set-platform "linux/$(go env GOARCH)" --insecure > dist/image.txt
    - printf 'IMAGE_DIGEST=%s\n' "$(cut -d@ -f2 dist/image.txt)" > dist/image.env
  artifacts:
    paths: [dist/image.txt]
    reports:
      dotenv: dist/image.env
    expire_in: 1 day

deploy:
  stage: deploy
  image: alpine:3.23
  interruptible: false
  resource_group: telemetry-ui-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: dev
    url: http://telemetry.localhost
  script:
    - apk add --no-cache git curl jq
    - git config user.name 'GitLab CI'
    - git config user.email 'ci@local.invalid'
    - git fetch origin "$CI_DEFAULT_BRANCH"
    # Refuse to deploy an older source revision over a newer push.
    - test -z "$(git diff --name-only "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH" -- . ':!deploy/values.yaml')"
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
    - mkdir -p deploy
    - |
      printf 'image:\n  repository: %s\n  tag: %s\n  digest: %s\nimagePullSecrets:\n  - name: telemetry-ui-registry\n' \
        "$CI_REGISTRY_IMAGE" "$CI_COMMIT_SHA" "$IMAGE_DIGEST" > deploy/values.yaml
    - git add deploy/values.yaml
    - |
      if ! git diff --cached --quiet; then
        git commit -m "Deploy telemetry-ui $CI_COMMIT_SHORT_SHA [skip ci]"
        git push origin "HEAD:$CI_DEFAULT_BRANCH"
      fi
    # Argo CD reads this file; CI only watches its rollout using a scoped service account.
    - |
      token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      url="https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT/apis/apps/v1/namespaces/dev/deployments/telemetry-ui"
      expected="$CI_REGISTRY_IMAGE@$IMAGE_DIGEST"
      for attempt in $(seq 1 90); do
        if ! state="$(curl --fail --silent --show-error --cacert "$ca" -H "Authorization: Bearer $token" "$url")"; then
          sleep 5
          continue
        fi
        if printf '%s' "$state" | jq -e --arg image "$expected" '
          .spec.template.spec.containers[0].image == $image and
          .status.observedGeneration >= .metadata.generation and
          (.status.updatedReplicas // 0) == .spec.replicas and
          (.status.availableReplicas // 0) == .spec.replicas and
          (.status.replicas // 0) == .spec.replicas' >/dev/null; then
          echo "Argo CD deployed $expected successfully."
          exit 0
        fi
        sleep 5
      done
      echo 'Argo CD rollout did not complete within 450 seconds.' >&2
      exit 1
