services:
  auth-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telemetry_auth
      POSTGRES_USER: telemetry_auth
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?Set AUTH_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U telemetry_auth -d telemetry_auth"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  auth-postgres-data:
