version: '3'
vars:
  CLUSTER_NAME: dev
  IMAGE_REPOSITORY: local/go-demo
  IMAGE_TAG: dev1
  IMAGE: '{{.IMAGE_REPOSITORY}}:{{.IMAGE_TAG}}'
  ARCHIVE: 'go-demo-{{.IMAGE_TAG}}.tar'
tasks:
  default:
    cmds:
      - task --list
  build:
    desc: Build the Go demo image and run its tests in Docker
    cmds:
      - docker build --tag "{{.IMAGE}}" .
  import:
    desc: Import the existing Docker image into the local k3d cluster
    cmds:
      - k3d image import "{{.IMAGE}}" --cluster "{{.CLUSTER_NAME}}"
  save:
    desc: Build and save the image as a tar archive for offline use
    deps: [build]
    cmds:
      - docker image save --output "{{.ARCHIVE}}" "{{.IMAGE}}"
  restart:
    desc: Restart the deployed Go demo and wait for readiness
    cmds:
      - kubectl --context "k3d-{{.CLUSTER_NAME}}" rollout restart deployment/go-demo --namespace dev
      - kubectl --context "k3d-{{.CLUSTER_NAME}}" rollout status deployment/go-demo --namespace dev --timeout=45s
  local:
    desc: Build, import into k3d, and restart the deployed Go demo
    cmds:
      - task: build
      - task: import
      - task: restart
