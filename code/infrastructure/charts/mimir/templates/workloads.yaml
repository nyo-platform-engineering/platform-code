apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    platform.local/owner: platform-team
  name: mimir-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    platform.local/owner: platform-team
  name: mimir
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http
      port: 9009
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  labels:
    platform.local/owner: platform-team
    app.kubernetes.io/name: mimir
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configs.yaml") . | sha256sum }}
      labels:
        platform.local/owner: platform-team
        app.kubernetes.io/name: mimir
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mimir
          image: {{ .Values.image }}
          workingDir: /data
          args: [-config.file=/etc/local/config.yaml, -target=all]
          ports:
            - name: http
              containerPort: 9009
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/local
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data
        - name: config
          configMap:
            name: mimir-config
