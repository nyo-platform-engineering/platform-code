# Isolasi storage berlaku pada service pemiliknya; tidak membatasi Tester Agent
# mengakses mock/admin atau memakai privilege resmi di namespace tester-agent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-owner-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aat-citus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: aggregator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aat-citus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tester-agent
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-publishers-consumers-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: aggregator
        - podSelector:
            matchLabels:
              role: consumer
      ports:
        - protocol: TCP
          port: 4222
