# Three shard groups with a primary/standby pair on different physical nodes.
# No node holds all groups. Patroni chooses the primary; these are placement pairs.
image:
  repository: ghcr.io/nyo-platform-engineering/aat-apps/citus
  tag: citus-13.0.1-patroni-4.1.0
citus:
  nodes: [aat-control, aat-worker-1, aat-worker-2]
  size: 2Gi
  groups:
  # The coordinator (group 0) also holds the satellite clustering tables, so the feed's
  # catch-up/burst speed is its CPU: at 1 CPU it was throttled ~20% of the time while the
  # Aggregators idled. Lampiran B fixes memory only (CPU is optional), so it gets 2 CPUs
  # as a ceiling; the request stays 100m, so it fits the 4-vCPU control VM.
  - id: 0
    nodes: [aat-control]
    cpuLimit: '2'
  - id: 1
    nodes: [aat-control, aat-worker-1]
  - id: 2
    nodes: [aat-worker-1, aat-worker-2]
  - id: 3
    nodes: [aat-worker-2, aat-control]
services:
  nats:
    image: nats:2.11-alpine
    port: 4222
    uid: 10001
    size: 1Gi
    mountPath: /data
    args:
    - -js
    - -sd
    - /data
    - -m
    - '8222'
    probe:
      httpGet:
        path: /healthz
        port: 8222
    role: broker
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: '1'
        memory: 1Gi
