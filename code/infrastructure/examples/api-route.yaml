# Apply after your application creates Service backend in namespace dev.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: dev
spec:
  parentRefs:
    - name: local
      namespace: traefik
      sectionName: web
  hostnames: [api.localhost]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 8080
