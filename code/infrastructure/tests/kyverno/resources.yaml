apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: dev
spec:
  containers:
    - name: app
      image: local/go-demo:dev1
  initContainers:
    - name: init
      image: busybox:1.37
---
apiVersion: v1
kind: Pod
metadata:
  name: violations
  namespace: dev
spec:
  containers:
    - name: app
      image: nginx:latest
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: untagged-init
  namespace: dev
spec:
  containers:
    - name: app
      image: local/go-demo:dev1
  initContainers:
    - name: init
      image: localhost:5000/busybox
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: LoadBalancer
  ports:
    - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: dev
spec:
  type: LoadBalancer
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ready
  namespace: dev
spec:
  selector:
    matchLabels:
      app: ready
  template:
    metadata:
      labels:
        app: ready
    spec:
      containers:
        - name: app
          image: local/go-demo:dev1
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-probe
  namespace: dev
spec:
  selector:
    matchLabels:
      app: missing-probe
  template:
    metadata:
      labels:
        app: missing-probe
    spec:
      containers:
        - name: app
          image: local/go-demo:dev1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: gitlab
  name: gitlab-toolbox
spec:
  selector:
    matchLabels:
      app: missing-probe
  template:
    metadata:
      labels:
        app: missing-probe
    spec:
      containers:
      - name: app
        image: local/go-demo:dev1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: kube-system
  name: local-path-provisioner
spec:
  selector:
    matchLabels:
      app: missing-probe
  template:
    metadata:
      labels:
        app: missing-probe
    spec:
      containers:
      - name: app
        image: local/go-demo:dev1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: kyverno
  name: kyverno-reports-controller
spec:
  selector:
    matchLabels:
      app: missing-probe
  template:
    metadata:
      labels:
        app: missing-probe
    spec:
      containers:
      - name: app
        image: local/go-demo:dev1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: kube-system
  name: unapproved-worker
spec:
  selector:
    matchLabels:
      app: missing-probe
  template:
    metadata:
      labels:
        app: missing-probe
    spec:
      containers:
      - name: app
        image: local/go-demo:dev1
