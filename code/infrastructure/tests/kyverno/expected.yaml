apiVersion: v1
kind: Pod
metadata:
  name: pod
  namespace: kube-system
spec:
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi
  - name: sidecar
    image: busybox:1.37
    resources:
      limits: {}
  - name: unsized
    image: busybox:1.37
  initContainers:
  - name: init
    image: busybox:1.37
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 32Mi
---
