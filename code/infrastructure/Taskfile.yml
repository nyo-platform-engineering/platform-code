version: '3'
includes:
  apps:
    taskfile: ../apps/Taskfile.yml
    dir: ../apps
    flatten: true
  local:
    taskfile: Taskfile.local.yml
    optional: true
vars:
  LOCAL_SETTINGS_YAML:
    sh: 'if test -f settings.local.yml; then cat settings.local.yml; else printf "{}"; fi'
  LOCAL_SETTINGS:
    ref: 'fromYaml .LOCAL_SETTINGS_YAML'
  CLUSTER_NAME: '{{.CLUSTER_NAME | default .LOCAL_SETTINGS.CLUSTER_NAME | default "dev"}}'
  HTTP_PORT: '{{.HTTP_PORT | default .LOCAL_SETTINGS.HTTP_PORT | default "80"}}'
  HTTPS_PORT: '{{.HTTPS_PORT | default .LOCAL_SETTINGS.HTTPS_PORT | default "443"}}'
  API_PORT: '{{.API_PORT | default .LOCAL_SETTINGS.API_PORT | default "6550"}}'
  K3S_IMAGE: '{{.K3S_IMAGE | default .LOCAL_SETTINGS.K3S_IMAGE | default "rancher/k3s:v1.34.5-k3s1"}}'
  GATEWAY_API_VERSION: '{{.GATEWAY_API_VERSION | default .LOCAL_SETTINGS.GATEWAY_API_VERSION | default "v1.5.1"}}'
  IMAGE_TAG: '{{.IMAGE_TAG | default .LOCAL_SETTINGS.IMAGE_TAG | default "dev1"}}'
  DOCKER_CONTEXT: '{{.DOCKER_CONTEXT | default .LOCAL_SETTINGS.DOCKER_CONTEXT | default ""}}'
  APP_CODE_DIR: '{{.APP_CODE_DIR | default .LOCAL_SETTINGS.APP_CODE_DIR | default "../apps"}}'
  NAMESPACE: monitoring
  TAIL: '50'
  FOLLOW: 'true'
env:
  DOCKER_CONTEXT: '{{.DOCKER_CONTEXT}}'
  CLUSTER_NAME: '{{.CLUSTER_NAME}}'
  HTTP_PORT: '{{.HTTP_PORT}}'
  HTTPS_PORT: '{{.HTTPS_PORT}}'
  API_PORT: '{{.API_PORT}}'
  K3S_IMAGE: '{{.K3S_IMAGE}}'
  GATEWAY_API_VERSION: '{{.GATEWAY_API_VERSION}}'
  APP_CODE_DIR: '{{.APP_CODE_DIR}}'
silent: true
tasks:
  default:
    cmds:
      - task --list
  setup:
    desc: Install CLI tools with winget (Windows), Homebrew (macOS), or pacman (Arch Linux)
    platforms: [windows, darwin, linux]
    cmds:
      - cmd: winget install --id k3d.k3d --exact --accept-package-agreements --accept-source-agreements
        platforms: [windows]
      - cmd: winget install --id Helm.Helm --exact --accept-package-agreements --accept-source-agreements
        platforms: [windows]
      - cmd: brew install k3d helm kubernetes-cli
        platforms: [darwin]
      - cmd: |
          if command -v pacman >/dev/null 2>&1; then
            pacman -S helm kubectl
          else
            echo "No pacman found. Install helm and kubectl manually for your distro." >&2
            exit 1
          fi
        platforms: [linux]
      - cmd: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
        platforms: [linux]
  up:
    desc: Create k3d, bootstrap Argo CD, and register the platform application
    cmds:
      - "bash scripts/bootstrap.sh up"
      - task: links
  gitlab:
    desc: Prepare GitLab, upload app code, and import projects (override ACTION for operations)
    vars:
      ACTION: '{{.ACTION | default "up"}}'
    cmds:
      - 'bash scripts/gitlab.sh "{{.ACTION}}"'
  down:
    desc: Delete cluster and its data
    cmds:
      - "k3d cluster delete {{.CLUSTER_NAME}}"
  restart:
    desc: Delete data and recreate cluster
    cmds:
      - task: down
      - task: up
  status:
    desc: Show pods, Argo CD apps, resource usage, and sizing checks
    cmds:
      - kubectl --context k3d-{{.CLUSTER_NAME}} get pods -A
      - "kubectl --context k3d-{{.CLUSTER_NAME}} get applications -n argocd"
      - kubectl --context k3d-{{.CLUSTER_NAME}} top nodes
      - kubectl --context k3d-{{.CLUSTER_NAME}} top pods -A --sort-by=memory
      - "bash scripts/bootstrap.sh resources"
  links:
    desc: Show local service URLs and login details
    vars:
      URL_PORT: '{{if ne .HTTP_PORT "80"}}:{{.HTTP_PORT}}{{end}}'
    cmds:
      - |
        printf '%-12s %s\n' \
          'Argo CD' 'http://argocd.localhost{{.URL_PORT}} (admin / task password)' \
          'Grafana' 'http://grafana.localhost{{.URL_PORT}} (admin / admin)' \
          'Radar' 'http://radar.localhost{{.URL_PORT}}' \
          'Traefik' 'http://traefik.localhost{{.URL_PORT}}/dashboard/' \
          'Go demo' 'http://go.localhost{{.URL_PORT}}' \
          'GitLab' 'http://gitlab.localhost{{.URL_PORT}} (root / task password)' \
          'Registry' 'http://registry.localhost{{.URL_PORT}}' \
          'GitLab KAS' 'ws://kas.localhost{{.URL_PORT}}'
  password:
    desc: Show initial Argo CD and GitLab passwords (override APP for one)
    vars:
      APP: '{{.APP | default "all"}}'
    cmds:
      - 'bash scripts/bootstrap.sh password "{{.APP}}"'
  test-labels:
    desc: Test Go demo ownership admission with server dry runs across namespaces
    cmds:
      - bash tests/ownership.sh
  logs:
    desc: Follow app logs (default otel-collector-cluster; override APP and NAMESPACE)
    vars:
      APP: '{{.APP | default "otel-collector-cluster"}}'
      LABEL_NAME: '{{if hasPrefix "otel-collector" .APP}}opentelemetry-collector{{else}}{{.APP}}{{end}}'
      SELECTOR: 'app.kubernetes.io/name={{.LABEL_NAME}}{{if hasPrefix "otel-collector" .APP}},app.kubernetes.io/instance={{.APP}}{{end}}'
    cmds:
      - 'kubectl --context "k3d-{{.CLUSTER_NAME}}" logs -n "{{.NAMESPACE}}" -l "{{.SELECTOR}}" --all-containers=true --tail={{.TAIL}} --follow={{.FOLLOW}}'
