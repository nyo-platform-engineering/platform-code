version: '3'
includes:
  apps:
    taskfile: ../apps/Taskfile.yml
    dir: ../apps
    flatten: true
vars:
  CLUSTER_NAME: dev
  HTTP_PORT: '80'
  HTTPS_PORT: '443'
  API_PORT: '6550'
  K3S_IMAGE: rancher/k3s:v1.34.5-k3s1
  GATEWAY_API_VERSION: v1.5.1
  APP: otel-collector
  NAMESPACE: monitoring
  TAIL: '50'
  FOLLOW: 'true'
env:
  CLUSTER_NAME: '{{.CLUSTER_NAME}}'
  HTTP_PORT: '{{.HTTP_PORT}}'
  HTTPS_PORT: '{{.HTTPS_PORT}}'
  API_PORT: '{{.API_PORT}}'
  K3S_IMAGE: '{{.K3S_IMAGE}}'
  GATEWAY_API_VERSION: '{{.GATEWAY_API_VERSION}}'
silent: true
tasks:
  default:
    cmds:
      - task --list
  setup:
    desc: Install k3d and Helm on Windows PATH using winget
    cmds:
      - winget install --id k3d.k3d --exact --accept-package-agreements --accept-source-agreements
      - winget install --id Helm.Helm --exact --accept-package-agreements --accept-source-agreements
  up:
    desc: Create k3d, bootstrap Argo CD, and register the platform application
    cmds:
      - "bash scripts/bootstrap.sh up"
      - task: links
  down:
    desc: Delete cluster and its data
    cmds:
      - "k3d cluster delete {{.CLUSTER_NAME}}"
  restart:
    desc: Delete data and recreate cluster
    cmds:
      - task: down
      - task: up
  status:
    desc: Show pods, Argo CD apps, resource usage, and sizing checks
    cmds:
      - kubectl --context k3d-{{.CLUSTER_NAME}} get pods -A
      - "kubectl --context k3d-{{.CLUSTER_NAME}} get applications -n argocd"
      - kubectl --context k3d-{{.CLUSTER_NAME}} top nodes
      - kubectl --context k3d-{{.CLUSTER_NAME}} top pods -A --sort-by=memory
      - "bash scripts/bootstrap.sh resources"
  links:
    desc: Show local service URLs and login details
    vars:
      URL_PORT: '{{if ne .HTTP_PORT "80"}}:{{.HTTP_PORT}}{{end}}'
    cmds:
      - |
        printf '%-12s %s\n' \
          'Argo CD' 'http://argocd.localhost{{.URL_PORT}} (admin / task password)' \
          'Grafana' 'http://grafana.localhost{{.URL_PORT}} (admin / admin)' \
          'Radar' 'http://radar.localhost{{.URL_PORT}}' \
          'Traefik' 'http://traefik.localhost{{.URL_PORT}}/dashboard/' \
          'Go demo' 'http://go.localhost{{.URL_PORT}}'
  password:
    desc: Show initial Argo CD admin password
    cmds:
      - "bash scripts/bootstrap.sh password"
  logs:
    desc: Follow app logs (default otel-collector; override APP and NAMESPACE)
    vars:
      LABEL_NAME: '{{if eq .APP "otel-collector"}}opentelemetry-collector{{else}}{{.APP}}{{end}}'
    cmds:
      - 'kubectl --context "k3d-{{.CLUSTER_NAME}}" logs -n "{{.NAMESPACE}}" -l "app.kubernetes.io/name={{.LABEL_NAME}}" --all-containers=true --tail={{.TAIL}} --follow={{.FOLLOW}}'
