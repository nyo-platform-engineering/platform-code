version: '3'
silent: true
tasks:
  doctor:
    desc: Check VM startup tools and libvirt/KVM prerequisites (task doctor -- --novm checks k3d)
    cmds: ['bash scripts/doctor/main.sh {{.CLI_ARGS}}']
  up:
    desc: Start the lab (-- --novm uses k3d; add --local-build for native local images)
    cmds:
      - 'GATEWAY_PORT="{{.PORT | default "80"}}" bash scripts/up/main.sh {{.CLI_ARGS}}'
  status:
    desc: Show nodes, AAT workloads, and LGTM health
    cmds: [bash scripts/status/main.sh]
  links:
    desc: Show local VM service URLs
    cmds: [bash scripts/links/main.sh]
  password:
    desc: Show Grafana, Argo CD, and analytics dashboard credentials with their URLs
    cmds:
      - 'bash scripts/password/main.sh "{{.APP | default "all"}}"'
  context:
    desc: Register the VM cluster as aat-local in your kubeconfig
    cmds: [bash scripts/context/main.sh]
  k9s:
    desc: Open K9s on aat-local across all namespaces
    cmds: [bash scripts/k9s/main.sh]
  vm:manager:
    desc: Open Virtual Machine Manager on the system libvirt connection
    cmds: [bash scripts/vm/main.sh manager]
  clock:status:
    desc: Summarize VM clock synchronization (use -- --verbose for full reports)
    cmds:
      - 'bash scripts/vm/clock.sh status {{.CLI_ARGS}}'
  clock:sync:
    desc: Configure chrony and wait for clock synchronization on existing VMs
    cmds: [bash scripts/vm/clock.sh sync]
  m2:p1:
    desc: Run the guided M2 P1 test; press Enter between steps
    interactive: true
    cmds:
      - 'python3 "{{.TASKFILE_DIR}}/../apps/aat/tests/m2/p1/test-problem-1.py"'
  m2:p2:
    desc: Run all eight guided M2 P2 checks, including 10,000-VU load and version rollout
    interactive: true
    cmds:
      - 'python3 "{{.TASKFILE_DIR}}/../apps/aat/tests/m2/p2/test-problem-2.py"'
  m2:p3:
    desc: Run guided M2 P3 schema, poison, replay and durable field-report checks on an isolated lab
    interactive: true
    cmds:
      - 'python3 "{{.TASKFILE_DIR}}/../apps/aat/tests/m2/p3/test-problem-3.py"'
  m2:p4:
    desc: Run the guided M2 P4 test (Feed Satelit); needs SATELLITE_GROUP_TOKEN in .env.runtime
    interactive: true
    cmds:
      - 'python3 "{{.TASKFILE_DIR}}/../apps/aat/tests/m2/p4/test-problem-4.py"'
  m2:p5:
    desc: Reset Sensor Pantai practice data, verify critical alerts, then test outage and client overload
    interactive: true
    cmds:
      - 'python3 "{{.TASKFILE_DIR}}/../apps/aat/tests/m2/p5/test-problem-5.py"'
  polling:freeze:
    desc: Temporarily disconnect BMKG/PVMBG upstreams; Enter or Ctrl+C restores them
    interactive: true
    cmds: [python3 scripts/tester/freeze-polling.py freeze]
  polling:resume:
    desc: Restore mock polling URLs and Argo settings from a saved freeze journal
    cmds: [python3 scripts/tester/freeze-polling.py resume]
  tester:install:
    desc: Install the exact official Tester Agent manifest from the PDF
    cmds: [bash scripts/tester/main.sh install]
  tester:list:
    desc: List available Tester Agent scenarios
    cmds: [bash scripts/tester/main.sh list]
  tester:practice:
    desc: Run a chosen practice disruption (SCENARIO=name)
    requires:
      vars: [SCENARIO]
    cmds:
      - 'bash scripts/tester/main.sh practice "{{.SCENARIO}}"'
  down:
    aliases: [vm:down, vm:halt]
    desc: Shut down the lab VMs (or stop the k3d cluster) while retaining their disks
    cmds: [bash scripts/vm/main.sh halt]
  destroy:
    aliases: [vm:destroy]
    desc: Delete the lab VMs and their disks (Vagrant asks for confirmation), or the k3d cluster
    cmds: [bash scripts/vm/main.sh destroy]
