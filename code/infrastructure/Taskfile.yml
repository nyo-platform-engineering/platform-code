version: '3'
silent: true
tasks:
  doctor:
    desc: Check VM startup tools and libvirt/KVM prerequisites
    cmds: [bash scripts/doctor/main.sh]
  up:
    desc: Start three local VMs and deploy AAT plus LGTM
    cmds:
      - 'GATEWAY_PORT="{{.PORT | default "80"}}" bash scripts/up/main.sh {{.CLI_ARGS}}'
  status:
    desc: Show nodes, AAT workloads, and LGTM health
    cmds: [bash scripts/status/main.sh]
  links:
    desc: Show local VM service URLs
    cmds: [bash scripts/links/main.sh]
  password:
    desc: Show the admin password (APP=grafana or argocd)
    cmds:
      - 'bash scripts/password/main.sh "{{.APP | default "grafana"}}"'
  tester:install:
    desc: Install the exact official Tester Agent manifest from the PDF
    cmds: [bash scripts/tester/main.sh install]
  tester:list:
    desc: List available Tester Agent scenarios
    cmds: [bash scripts/tester/main.sh list]
  tester:practice:
    desc: Run a chosen practice disruption (SCENARIO=name)
    requires:
      vars: [SCENARIO]
    cmds:
      - 'bash scripts/tester/main.sh practice "{{.SCENARIO}}"'
  down:
    desc: Shut down the lab VMs while retaining their disks
    cmds: [bash scripts/down/main.sh]
  destroy:
    desc: Delete the lab VMs and their disks (Vagrant asks for confirmation)
    cmds: [bash scripts/destroy/main.sh]
