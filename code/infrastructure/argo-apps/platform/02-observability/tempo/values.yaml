podLabels:
  platform.local/owner: platform-team
  role: store
global:
  commonLabels:
    platform.local/owner: platform-team
fullnameOverride: tempo
replicas: 1
tempo:
  tag: 2.9.0
  resources:
    # CPU = 1.4 x observed average; memory = 1.4 x observed peak. Rounded up.
    requests: {cpu: 3m, memory: 37Mi}
    limits:
      memory: 1Gi
  memBallastSizeMbs: 0
  retention: 72h
  # Traces Drilldown uses TraceQL metrics, served by local-blocks in Tempo 2.9.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://mimir:9009/api/v1/push
    storage:
      path: /var/tempo/generator/metrics
    traces_storage:
      path: /var/tempo/generator/traces
    processor:
      local_blocks:
        filter_server_spans: false
        flush_to_storage: true
        max_block_duration: 1m
  overrides:
    defaults:
      metrics_generator:
        processors: [local-blocks]
  ingester:
    max_block_duration: 5m
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/blocks
      wal:
        path: /var/tempo/wal
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
  enableStatefulSetAutoDeletePVC: false
nodeSelector:
  kubernetes.io/hostname: aat-control
