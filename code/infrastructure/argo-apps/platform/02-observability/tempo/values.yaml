podLabels:
  platform.local/owner: platform-team
  role: store
global:
  commonLabels:
    platform.local/owner: platform-team
fullnameOverride: tempo
replicas: 1
tempo:
  tag: 2.9.0
  resources:
    # CPU = 1.4 x observed average; memory = 1.4 x observed peak. Rounded up.
    requests: {cpu: 3m, memory: 37Mi}
    limits:
      memory: 1Gi
  memBallastSizeMbs: 0
  retention: 72h
  ingester:
    max_block_duration: 5m
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/blocks
      wal:
        path: /var/tempo/wal
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
  enableStatefulSetAutoDeletePVC: false
nodeSelector:
  kubernetes.io/hostname: aat-control
