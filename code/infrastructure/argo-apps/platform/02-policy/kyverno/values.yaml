customLabels:
  platform.local/owner: platform-team
# Admission mutation only: remove CPU limits; all validation/reporting is disabled.
config:
  enableDefaultRegistryMutation: false
  # Include system workloads and Kyverno itself, as well as application namespaces.
  resourceFilters: []
  excludeKyvernoNamespace: false
  webhooks:
    namespaceSelector:
      matchExpressions: []
features:
  admissionReports:
    enabled: false
  aggregateReports:
    enabled: false
  policyReports:
    enabled: false
  validatingAdmissionPolicyReports:
    enabled: false
  backgroundScan:
    enabled: false
  generateValidatingAdmissionPolicy:
    enabled: false
crds:
  migration:
    podLabels:
      platform.local/owner: platform-team
    podResources:
      requests: null
      limits: null
admissionController:
  podLabels:
    platform.local/owner: platform-team
  replicas: 1
  initContainer:
    resources:
      requests: null
      limits: null
  container:
    resources:
      requests: null
      limits: null
backgroundController:
  enabled: false
cleanupController:
  enabled: false
reportsController:
  enabled: false
  podLabels:
    platform.local/owner: platform-team
  replicas: 1
  resources:
    requests: null
    limits: null
webhooksCleanup:
  podLabels:
    platform.local/owner: platform-team
  resources:
    requests: null
    limits: null
test:
  resources:
    requests: null
    limits: null
