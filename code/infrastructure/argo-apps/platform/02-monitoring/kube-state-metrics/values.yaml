podLabels:
  platform.local/owner: platform-team
customLabels:
  platform.local/owner: platform-team
fullnameOverride: kube-state-metrics
replicas: 1
resources: {}
collectors: [pods]
metricAllowlist:
  - kube_pod_status_ready
  - kube_pod_container_status_restarts_total
prometheusScrape: false
selfMonitor:
  enabled: false
prometheus:
  monitor:
    enabled: false
