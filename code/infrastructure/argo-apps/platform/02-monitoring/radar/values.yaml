podLabels:
  platform.local/owner: platform-team
  role: other
fullnameOverride: radar
ingress:
  enabled: false
httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: local
      namespace: traefik
      sectionName: web
  hostnames:
    - radar.localhost
  # Match Kubernetes' defaulted HTTPRoute references to avoid perpetual OutOfSync.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: radar
          port: 9280
          weight: 1
resources:
  # CPU = 1.4 x observed average; memory = 1.4 x observed peak. Rounded up.
  requests: {cpu: 3m, memory: 86Mi}
  limits:
    memory: 256Mi
