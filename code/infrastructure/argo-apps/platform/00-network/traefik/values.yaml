commonLabels:
  platform.local/owner: platform-team
deployment:
  podLabels:
    platform.local/owner: platform-team
    role: other
  replicas: 1
# Keep the singleton entry point outside deliberate worker freeze/loss tests.
nodeSelector:
  kubernetes.io/hostname: aat-control
providers:
  kubernetesGateway:
    enabled: true
    statusAddress:
      hostname: localhost
      service:
        enabled: false
gateway:
  enabled: false
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30088
  websecure:
    expose:
      default: false
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.localhost`)
    entryPoints: [web]
accessLog:
  enabled: true
resources:
  # The 10,000-VU P2 run exceeded the old 256Mi limit and was OOMKilled.
  # Request scheduling headroom; the runner also bounds offered traffic.
  requests: {cpu: 50m, memory: 128Mi}
  limits:
    memory: 512Mi
