commonLabels:
  platform.local/owner: platform-team
deployment:
  podLabels:
    platform.local/owner: platform-team
    role: other
  replicas: 1
providers:
  kubernetesGateway:
    enabled: true
    statusAddress:
      hostname: localhost
      service:
        enabled: false
gateway:
  enabled: false
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30088
  websecure:
    expose:
      default: false
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.localhost`)
    entryPoints: [web]
accessLog:
  enabled: true
resources:
  # CPU = 1.4 x observed average; memory = 1.4 x observed peak. Rounded up.
  requests: {cpu: 1m, memory: 45Mi}
  limits:
    memory: 256Mi
