apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  labels:
    platform.local/owner: platform-team
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.5.1
    path: config/crd/standard
    directory:
      # Install the standard CRDs without the optional upgrade admission policy.
      exclude: '*_vap_*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      # Retain shared CRDs if this Application is removed.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
