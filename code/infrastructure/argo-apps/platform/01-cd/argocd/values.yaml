global:
  additionalLabels:
    platform.local/owner: platform-team
  podLabels:
    platform.local/owner: platform-team
    role: other
fullnameOverride: argocd
configs:
  params:
    server.insecure: true
    # Keep startup reconciliation bursts small on the three-VM lab.
    controller.status.processors: '5'
    controller.operation.processors: '2'
    reposerver.parallelism.limit: '2'
server:
  replicas: 1
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 256Mi}
  ingress:
    enabled: false
controller:
  replicas: 1
  # Cluster discovery/cache exceeded the previous 256Mi limit during startup.
  resources:
    requests: {memory: 512Mi}
    limits: {memory: 1Gi}
  metrics:
    enabled: true
repoServer:
  replicas: 1
  # Helm/Git child processes need burst headroom beyond the server's idle usage.
  resources:
    requests: {memory: 256Mi}
    limits: {memory: 1Gi}
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 256Mi}
  readinessProbe:
    enabled: true
redis:
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 256Mi}
  readinessProbe:
    enabled: true
redisSecretInit:
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 256Mi}
