fullnameOverride: argocd
configs:
  cm:
    resource.customizations.health.argoproj.io_Application: |
      local health = {status = "Progressing", message = "Waiting for application"}
      if obj.status ~= nil and obj.status.health ~= nil then
        health.status = obj.status.health.status
        health.message = obj.status.health.message or ""
      end
      return health
  params:
    server.insecure: true
server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localhost
controller:
  replicas: 1
repoServer:
  replicas: 1
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
