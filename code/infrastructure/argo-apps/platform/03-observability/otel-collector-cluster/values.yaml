podLabels:
  platform.local/owner: platform-team
  role: consumer
additionalLabels:
  platform.local/owner: platform-team
fullnameOverride: otel-collector-cluster
mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.160.0
command:
  name: otelcol-contrib
resources:
  # CPU = 1.4 x observed average; memory = 1.4 x observed peak. Rounded up.
  requests: {cpu: 4m, memory: 142Mi}
  limits:
    memory: 256Mi
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
alternateConfig:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    prometheus:
      config:
        scrape_configs:
        - job_name: kube-state-metrics
          scrape_interval: 30s
          static_configs:
          - targets:
            - kube-state-metrics:8080
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 192
      spike_limit_mib: 32
    batch:
      timeout: 5s
      send_batch_size: 128
      send_batch_max_size: 256
  exporters:
    prometheus_remote_write:
      endpoint: http://mimir:9009/api/v1/push
    otlp_http/loki:
      endpoint: http://loki:3100/otlp
    otlp_http/tempo:
      endpoint: http://tempo:4318
  service:
    extensions:
    - health_check
    pipelines:
      metrics:
        receivers:
        - otlp
        - prometheus
        processors:
        - memory_limiter
        - batch
        exporters:
        - prometheus_remote_write
      logs:
        receivers:
        - otlp
        processors:
        - memory_limiter
        - batch
        exporters:
        - otlp_http/loki
      traces:
        receivers:
        - otlp
        processors:
        - memory_limiter
        - batch
        exporters:
        - otlp_http/tempo
replicaCount: 1
