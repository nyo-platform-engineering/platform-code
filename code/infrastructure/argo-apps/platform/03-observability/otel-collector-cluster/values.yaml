podLabels:
  platform.local/owner: platform-team
additionalLabels:
  platform.local/owner: platform-team
fullnameOverride: otel-collector-cluster
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.160.0
command:
  name: otelcol-contrib
resources: {}
extraEnvs:
  - name: CLICKHOUSE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: clickhouse-credentials
        key: ingestPassword
service:
  enabled: true
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus:
      config:
        scrape_configs:
          - job_name: policy-reporter
            scrape_interval: 30s
            scrape_timeout: 10s
            static_configs:
              - targets: [policy-reporter.monitoring.svc.cluster.local:8080]
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'policy_report_result|cluster_policy_report_result'
                action: keep
          - job_name: clickhouse
            scrape_interval: 60s
            scrape_timeout: 10s
            static_configs:
              - targets: [clickhouse:9363]
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'process_cpu_seconds_total|process_resident_memory_bytes|go_goroutines'
                action: keep
          - job_name: kube-state-metrics
            scrape_interval: 60s
            scrape_timeout: 10s
            static_configs:
              - targets: [kube-state-metrics:8080]
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'kube_pod_status_ready|kube_pod_container_status_restarts_total'
                action: keep
              # Keep one readiness series per pod; restart counters have no condition.
              - source_labels: [condition]
                regex: 'true|'
                action: keep
              - regex: uid
                action: labeldrop
          - job_name: argocd
            scrape_interval: 60s
            scrape_timeout: 10s
            static_configs:
              - targets: [argocd-application-controller-metrics.argocd.svc.cluster.local:8082]
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'argocd_app_info|argocd_app_sync_total'
                action: keep
              - regex: '__name__|name|namespace|health_status|sync_status|phase|job|instance'
                action: labelkeep
  processors:
    memory_limiter: null
    filter/minimal:
      error_mode: ignore
      metric_conditions:
        # Matching conditions DROP metrics; negate the small allowlist.
        # Prometheus counters may lose their _total suffix during conversion.
        - 'not IsMatch(metric.name, "^(up|policy_report_result|cluster_policy_report_result|process_cpu_seconds(_total)?|process_resident_memory_bytes|go_goroutines|argocd_app_info|argocd_app_sync(_total)?|kube_pod_status_ready|kube_pod_container_status_restarts(_total)?|http[.]server[.](request[.]duration|duration|active_requests))$")'
    batch:
      timeout: 5s
      send_batch_size: 256
      send_batch_max_size: 512
  exporters:
    debug: null
    prometheusremotewrite/mimir:
      endpoint: http://mimir:9009/api/v1/push
    clickhouse:
      endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4&enable_json_type=1
      database: otel
      username: otelcollector
      password: ${env:CLICKHOUSE_PASSWORD}
      async_insert: true
      ttl: 72h
      create_schema: true
      logs_table_name: otel_logs
      traces_table_name: otel_traces
      timeout: 5s
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
  service:
    pipelines:
      metrics:
        receivers: [prometheus, otlp]
        processors: [filter/minimal, batch]
        exporters: [prometheusremotewrite/mimir]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [clickhouse]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [clickhouse]
