podLabels:
  platform.local/owner: platform-team
additionalLabels:
  platform.local/owner: platform-team
fullnameOverride: otel-collector-daemon
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.160.0
command:
  name: otelcol-contrib
resources: {}
initContainers:
  - name: wait-for-clickhouse
    image: busybox:1.37.0
    command: [sh, -ec]
    args:
      - |
        until nslookup clickhouse.monitoring.svc.cluster.local >/dev/null 2>&1 && nc -z clickhouse.monitoring.svc.cluster.local 9000; do
          echo "waiting for ClickHouse DNS and native port"
          sleep 2
        done
    resources: {}
extraEnvs:
  - name: CLICKHOUSE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: clickhouse-credentials
        key: ingestPassword
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [nodes/metrics]
      verbs: [get]
service:
  enabled: false
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    file_log:
      exclude:
        - /var/log/pods/monitoring_otel-collector-cluster*/*/*.log
        - /var/log/pods/monitoring_otel-collector-daemon*/*/*.log
    prometheus:
      config:
        scrape_configs:
          - job_name: cadvisor
            scheme: https
            metrics_path: /metrics/cadvisor
            scrape_interval: 60s
            scrape_timeout: 10s
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            static_configs:
              - targets: ["${env:OTEL_K8S_NODE_IP}:10250"]
                labels:
                  node: "${env:OTEL_K8S_NODE_NAME}"
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes'
                action: keep
              - source_labels: [container]
                regex: '|POD'
                action: drop
              - source_labels: [namespace, pod]
                regex: '.+;.+'
                action: keep
              # Retain total CPU only, avoiding one series per CPU core.
              - source_labels: [cpu]
                regex: 'total|'
                action: keep
              # Keep id to distinguish containers during restarts.
              - regex: 'image|name'
                action: labeldrop
  processors:
    filter/minimal:
      error_mode: ignore
      metric_conditions:
        # Matching conditions DROP metrics; negate the small allowlist.
        # Prometheus counters may lose their _total suffix during conversion.
        - 'not IsMatch(metric.name, "^(up|container_cpu_usage_seconds(_total)?|container_memory_working_set_bytes)$")'
    batch:
      timeout: 5s
      send_batch_size: 256
      send_batch_max_size: 512
  exporters:
    prometheusremotewrite/mimir:
      endpoint: http://mimir:9009/api/v1/push
    clickhouse:
      endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4&enable_json_type=1
      database: otel
      username: otelcollector
      password: ${env:CLICKHOUSE_PASSWORD}
      async_insert: true
      ttl: 72h
      # The cluster collector owns DDL so multiple collectors never race it.
      create_schema: false
      logs_table_name: otel_logs
      traces_table_name: otel_traces
      timeout: 5s
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
  service:
    extensions: [health_check]
    pipelines:
      metrics:
        receivers: [prometheus]
        processors: [filter/minimal, batch]
        exporters: [prometheusremotewrite/mimir]
      logs:
        receivers: [file_log]
        processors: [batch]
        exporters: [clickhouse]
