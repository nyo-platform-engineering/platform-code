podLabels:
  platform.local/owner: platform-team
additionalLabels:
  platform.local/owner: platform-team
fullnameOverride: otel-collector-daemon
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.160.0
command:
  name: otelcol-contrib
resources: {}
extraEnvs:
  - name: HYPERDX_API_KEY
    valueFrom:
      secretKeyRef:
        name: clickstack-secret
        key: HYPERDX_API_KEY
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [nodes/metrics]
      verbs: [get]
service:
  enabled: false
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    file_log:
      exclude:
        - /var/log/pods/monitoring_otel-collector-cluster*/*/*.log
        - /var/log/pods/monitoring_otel-collector-daemon*/*/*.log
        - /var/log/pods/monitoring_clickstack-otel-collector*/*/*.log
    prometheus:
      config:
        scrape_configs:
          - job_name: cadvisor
            scheme: https
            metrics_path: /metrics/cadvisor
            scrape_interval: 60s
            scrape_timeout: 10s
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            static_configs:
              - targets: ["${env:OTEL_K8S_NODE_IP}:10250"]
                labels:
                  node: "${env:OTEL_K8S_NODE_NAME}"
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes'
                action: keep
              - source_labels: [container]
                regex: '|POD'
                action: drop
              - source_labels: [namespace, pod]
                regex: '.+;.+'
                action: keep
              # Retain total CPU only, avoiding one series per CPU core.
              - source_labels: [cpu]
                regex: 'total|'
                action: keep
              # Keep id to distinguish containers during restarts.
              - regex: 'image|name'
                action: labeldrop
  processors:
    filter/minimal:
      error_mode: ignore
      metric_conditions:
        # Matching conditions DROP metrics; negate the small allowlist.
        # Prometheus counters may lose their _total suffix during conversion.
        - 'not IsMatch(metric.name, "^(up|container_cpu_usage_seconds(_total)?|container_memory_working_set_bytes)$")'
    batch:
      timeout: 5s
      send_batch_size: 256
      send_batch_max_size: 512
  exporters:
    otlp_http/clickstack:
      endpoint: http://clickstack-otel-collector:4318
      compression: gzip
      headers:
        authorization: ${env:HYPERDX_API_KEY}
  service:
    extensions: [health_check]
    pipelines:
      metrics:
        receivers: [prometheus]
        processors: [filter/minimal, batch]
        exporters: [otlp_http/clickstack]
      logs:
        receivers: [file_log]
        processors: [batch]
        exporters: [otlp_http/clickstack]
