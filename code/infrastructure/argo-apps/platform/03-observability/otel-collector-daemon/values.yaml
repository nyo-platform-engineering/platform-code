podLabels:
  platform.local/owner: platform-team
  role: consumer
additionalLabels:
  platform.local/owner: platform-team
fullnameOverride: otel-collector-daemon
mode: daemonset
# Share the VM network namespace so network scrapes describe the node interfaces.
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.160.0
command:
  name: otelcol-contrib
resources:
  # CPU = 1.4 x observed average; memory = 1.4 x observed peak. Rounded up.
  requests: {cpu: 10m, memory: 95Mi}
  limits:
    memory: 256Mi
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  otlp:
    enabled: false
  otlp-http:
    enabled: false
alternateConfig:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
    file_storage:
      directory: /var/lib/otelcol
  receivers:
    # One agent per node reads the VM's OS counters through a read-only mount.
    hostmetrics:
      collection_interval: 30s
      root_path: /hostfs
      scrapers:
        cpu:
          metrics:
            system.cpu.utilization:
              enabled: true
              attributes: [cpu, state]
        load: {}
        memory:
          metrics:
            system.memory.utilization:
              enabled: true
            system.memory.limit:
              enabled: true
            system.linux.memory.available:
              enabled: true
        filesystem:
          # Only the VM root disk; omit pod mounts and virtual filesystems.
          include_mount_points:
            mount_points: ['/']
            match_type: strict
        disk:
          exclude:
            devices: ['^(loop|ram|fd).*']
            match_type: regexp
        network:
          # Physical VM NICs remain; pod bridges/tunnels would double-count traffic.
          exclude:
            interfaces: ['^(lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*)$']
            match_type: regexp
    filelog:
      include:
      - /var/log/pods/*/*/*.log
      exclude:
      - /var/log/pods/monitoring_otel-*/*/*.log
      include_file_path: true
      start_at: beginning
      storage: file_storage
      operators:
      - type: container
        id: container-parser
    prometheus:
      config:
        scrape_configs:
        - job_name: cadvisor
          scheme: https
          metrics_path: /metrics/cadvisor
          scrape_interval: 30s
          authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
          static_configs:
          - targets:
            - ${env:NODE_IP}:10250
          metric_relabel_configs:
          - source_labels:
            - __name__
            regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
            action: keep
  processors:
    # Put node identity on each host datapoint so Mimir preserves it as a label.
    # Keep this separate from container metrics and application telemetry.
    transform/node:
      metric_statements:
      - context: datapoint
        statements:
        - set(attributes["node"], "${env:NODE_NAME}")
    memory_limiter:
      check_interval: 1s
      limit_mib: 192
      spike_limit_mib: 32
    k8sattributes:
      filter:
        node_from_env_var: NODE_NAME
      extract:
        metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.node.name
        labels:
        - tag_name: service.name
          key: app.kubernetes.io/name
          from: pod
      pod_association:
      - sources:
        - from: resource_attribute
          name: k8s.pod.uid
    batch:
      timeout: 5s
      send_batch_size: 128
      send_batch_max_size: 256
  exporters:
    otlp_http:
      endpoint: http://otel-collector-cluster:4318
  service:
    extensions:
    - health_check
    - file_storage
    pipelines:
      metrics/host:
        receivers:
        - hostmetrics
        processors:
        - memory_limiter
        - transform/node
        - batch
        exporters:
        - otlp_http
      logs:
        receivers:
        - filelog
        processors:
        - memory_limiter
        - k8sattributes
        - batch
        exporters:
        - otlp_http
      metrics:
        receivers:
        - prometheus
        processors:
        - memory_limiter
        - batch
        exporters:
        - otlp_http
service:
  enabled: false
securityContext:
  runAsUser: 0
  runAsGroup: 0
  readOnlyRootFilesystem: true
clusterRole:
  create: true
  rules:
  - apiGroups:
    - ''
    resources:
    - nodes/metrics
    verbs:
    - get
  - apiGroups:
    - ''
    resources:
    - pods
    - namespaces
    verbs:
    - get
    - list
    - watch
extraEnvs:
- name: NODE_NAME
  valueFrom:
    fieldRef:
      fieldPath: spec.nodeName
- name: NODE_IP
  valueFrom:
    fieldRef:
      fieldPath: status.hostIP
extraVolumes:
- name: host-root
  hostPath:
    path: /
    type: Directory
- name: pod-logs
  hostPath:
    path: /var/log/pods
    type: Directory
- name: offsets
  hostPath:
    path: /var/lib/aat-otelcol
    type: DirectoryOrCreate
extraVolumeMounts:
- name: host-root
  mountPath: /hostfs
  readOnly: true
  mountPropagation: HostToContainer
- name: pod-logs
  mountPath: /var/log/pods
  readOnly: true
- name: offsets
  mountPath: /var/lib/otelcol
