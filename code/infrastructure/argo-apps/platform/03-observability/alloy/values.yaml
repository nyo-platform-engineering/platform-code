configReloader:
  resources:
    requests:
      cpu: null
      memory: null
controller:
  type: deployment
  replicas: 1
alloy:
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  configMap:
    content: |
      discovery.kubernetes "pods" { role = "pod" }
      discovery.relabel "logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }
      }
      loki.source.kubernetes "pods" {
        targets = discovery.relabel.logs.output
        forward_to = [loki.write.local.receiver]
      }
      loki.write "local" {
        endpoint { url = "http://loki:3100/loki/api/v1/push" }
      }
      prometheus.scrape "backends" {
        targets = [
          {"__address__" = "loki:3100", "job" = "loki"},
          {"__address__" = "tempo:3200", "job" = "tempo"},
          {"__address__" = "mimir:9009", "job" = "mimir"},
        ]
        forward_to = [prometheus.remote_write.local.receiver]
      }
      prometheus.remote_write "local" {
        endpoint { url = "http://mimir:9009/api/v1/push" }
      }
      otelcol.receiver.otlp "apps" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }
        output {
          traces = [otelcol.processor.batch.apps.input]
          metrics = [otelcol.processor.batch.apps.input]
          logs = [otelcol.processor.batch.apps.input]
        }
      }
      otelcol.processor.batch "apps" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
          metrics = [otelcol.exporter.prometheus.mimir.input]
          logs = [otelcol.exporter.loki.local.input]
        }
      }
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo:4317"
          tls { insecure = true }
        }
      }
      otelcol.exporter.prometheus "mimir" {
        forward_to = [prometheus.remote_write.local.receiver]
      }
      otelcol.exporter.loki "local" {
        forward_to = [loki.write.local.receiver]
      }
