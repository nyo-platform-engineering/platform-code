extraLabels:
  platform.local/owner: platform-team
fullnameOverride: grafana
image:
  tag: 12.3.2
adminUser: admin
adminPassword: admin
resources: {}
plugins:
  - grafana-clickhouse-datasource 4.21.3
envValueFrom:
  CLICKHOUSE_APP_PASSWORD:
    secretKeyRef:
      name: clickhouse-credentials
      key: appPassword
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: policies
        orgId: 1
        folder: Policies
        type: file
        disableDeletion: false
        editable: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards/policies
dashboardsConfigMaps:
  policies: grafana-policy-reports
initChownData:
  # This established PVC already belongs to Grafana (UID 472). Its private
  # output directories cannot be traversed by the chart's restricted chown init.
  enabled: false
  resources: {}
service:
  port: 3000
  targetPort: 3000
persistence:
  enabled: true
  storageClassName: local-path
  size: 1Gi
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.localhost
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir:9009/prometheus
        isDefault: true
      - name: ClickHouse
        uid: clickhouse
        type: grafana-clickhouse-datasource
        access: proxy
        editable: true
        jsonData:
          host: clickhouse.monitoring.svc.cluster.local
          port: 9000
          protocol: native
          username: app
          defaultDatabase: otel
          configMode: classic
          logs:
            defaultDatabase: otel
            defaultTable: otel_logs
            otelEnabled: true
          traces:
            defaultDatabase: otel
            defaultTable: otel_traces
            otelEnabled: true
        secureJsonData:
          password: $CLICKHOUSE_APP_PASSWORD
