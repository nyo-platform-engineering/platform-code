extraLabels:
  platform.local/owner: platform-team
fullnameOverride: grafana
image:
  tag: 12.3.2
adminUser: admin
resources:
  # CPU = 1.4 x observed average; memory = 1.4 x observed peak. Rounded up.
  requests: {cpu: 4m, memory: 234Mi}
  limits:
    memory: 256Mi
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: aat
      orgId: 1
      folder: AAT
      type: file
      disableDeletion: false
      editable: false
      updateIntervalSeconds: 10
      options:
        path: /var/lib/grafana/dashboards/aat
dashboardsConfigMaps:
  aat: grafana-aat
initChownData:
  enabled: false
  resources: {}
service:
  port: 3000
  targetPort: 3000
  type: NodePort
  nodePort: 30300
persistence:
  enabled: true
  storageClassName: local-path
  size: 1Gi
ingress:
  enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Mimir
      uid: mimir
      type: prometheus
      access: proxy
      url: http://mimir:9009/prometheus
      isDefault: true
      jsonData:
        timeInterval: 30s
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          tags:
          - key: k8s.namespace.name
            value: k8s_namespace_name
        serviceMap:
          datasourceUid: mimir
        nodeGraph:
          enabled: true
podLabels:
  role: other
nodeSelector:
  kubernetes.io/hostname: aat-control
admin:
  existingSecret: grafana-admin
  userKey: username
  passwordKey: password
