apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: grafana-policy-reports
    files:
      - kyverno-policy-reports.json
  - name: grafana-platform-overview
    files:
      - platform-overview.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: '1'
    platform.local/owner: platform-team
