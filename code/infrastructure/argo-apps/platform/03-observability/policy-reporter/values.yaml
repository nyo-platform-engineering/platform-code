fullnameOverride: policy-reporter
global:
  labels:
    platform.local/owner: platform-team
podLabels:
  platform.local/owner: platform-team
resources: {}
# Include controller-owned Pods/ReplicaSets as well as their parent workloads.
sourceFilters: []
metrics:
  enabled: true
  mode: custom
  # Workload names enable drill-down; messages and report IDs stay out of metrics.
  customLabels: [namespace, policy, rule, kind, name, status, source]
