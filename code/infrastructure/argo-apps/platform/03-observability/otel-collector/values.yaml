fullnameOverride: otel-collector
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.160.0
command:
  name: otelcol-contrib
resources: {}
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [nodes/metrics]
      verbs: [get]
service:
  enabled: true
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus:
      config:
        scrape_configs:
          - job_name: loki
            scrape_interval: 60s
            scrape_timeout: 10s
            static_configs:
              - targets: [loki:3100]
            metric_relabel_configs: &minimal_backend_metrics
              - source_labels: [__name__]
                regex: 'process_cpu_seconds_total|process_resident_memory_bytes|go_goroutines'
                action: keep
          - job_name: tempo
            scrape_interval: 60s
            scrape_timeout: 10s
            static_configs:
              - targets: [tempo:3200]
            metric_relabel_configs: *minimal_backend_metrics
          - job_name: mimir
            scrape_interval: 60s
            scrape_timeout: 10s
            static_configs:
              - targets: [mimir:9009]
            metric_relabel_configs: *minimal_backend_metrics
          - job_name: kube-state-metrics
            scrape_interval: 60s
            scrape_timeout: 10s
            static_configs:
              - targets: [kube-state-metrics:8080]
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'kube_pod_status_ready|kube_pod_container_status_restarts_total'
                action: keep
              # Keep one readiness series per pod; restart counters have no condition.
              - source_labels: [condition]
                regex: 'true|'
                action: keep
              - regex: uid
                action: labeldrop
          - job_name: cadvisor
            scheme: https
            metrics_path: /metrics/cadvisor
            scrape_interval: 60s
            scrape_timeout: 10s
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            static_configs:
              - targets: ["${env:OTEL_K8S_NODE_IP}:10250"]
                labels:
                  node: "${env:OTEL_K8S_NODE_NAME}"
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes'
                action: keep
              - source_labels: [container]
                regex: '|POD'
                action: drop
              - source_labels: [namespace, pod]
                regex: '.+;.+'
                action: keep
              # Retain total CPU only, avoiding one series per CPU core.
              - source_labels: [cpu]
                regex: 'total|'
                action: keep
              # Keep id to distinguish containers during restarts.
              - regex: 'image|name'
                action: labeldrop
  processors:
    memory_limiter: null
    filter/minimal:
      error_mode: ignore
      metric_conditions:
        # Matching conditions DROP metrics; negate the small allowlist.
        # Prometheus counters may lose their _total suffix during conversion.
        - 'not IsMatch(metric.name, "^(up|process_cpu_seconds(_total)?|process_resident_memory_bytes|go_goroutines|kube_pod_status_ready|kube_pod_container_status_restarts(_total)?|container_cpu_usage_seconds(_total)?|container_memory_working_set_bytes|http[.]server[.](request[.]duration|duration|active_requests))$")'
    batch:
      timeout: 5s
      send_batch_size: 256
      send_batch_max_size: 512
  exporters:
    debug: null
    prometheusremotewrite/mimir:
      endpoint: http://mimir:9009/api/v1/push
      target_info:
        enabled: false
      resource_to_telemetry_conversion:
        enabled: false
    otlp/tempo:
      endpoint: tempo:4317
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://loki:3100/otlp
  service:
    pipelines:
      metrics:
        receivers: [prometheus, otlp]
        processors: [filter/minimal, batch]
        exporters: [prometheusremotewrite/mimir]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/loki]
