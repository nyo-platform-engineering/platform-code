# Declare reference defaults explicitly so API defaulting does not cause sync drift.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: client
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    platform.local/owner: platform-team
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: local
      namespace: traefik
      sectionName: web
  hostnames: [client.localhost]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - group: ""
          kind: Service
          name: client
          port: 8080
          weight: 1
---
