apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: client
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    platform.local/owner: platform-team
spec:
  parentRefs:
    - name: local
      namespace: traefik
      sectionName: web
  hostnames: [client.localhost]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: client
          port: 8080
---
