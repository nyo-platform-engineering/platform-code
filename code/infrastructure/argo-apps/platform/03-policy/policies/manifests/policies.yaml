# Cluster-scoped validation only. Audit reports violations without rejecting writes.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-versioned-images
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, daemonsets, statefulsets, jobs, cronjobs]
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.image.contains('@')
          ? c.image.matches('^.+@sha256:[a-fA-F0-9]{64}$')
          : c.image.matches('^.+:[^/:@]+$') && !c.image.endsWith(':latest'))
      message: Images must have an explicit non-latest tag or a SHA256 digest.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-loadbalancer-services
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  validations:
    - expression: >-
        !has(object.spec.type) || object.spec.type != 'LoadBalancer' ||
        (object.metadata.namespace == 'traefik' && object.metadata.name == 'traefik')
      message: Only traefik/traefik may expose a LoadBalancer Service; apps use the Gateway.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, daemonsets, statefulsets, jobs, cronjobs]
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  matchConditions:
    - name: exclude-system
      expression: object.metadata.namespace != 'kube-system'
  validations:
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) ||
          !has(c.securityContext.privileged) || !c.securityContext.privileged)
      message: Containers must not run in privileged mode (kube-system is exempt).
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-deployment-readiness
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
  validations:
    - expression: object.spec.template.spec.containers.all(c, has(c.readinessProbe))
      message: Every Deployment container must define a readiness probe.
---
# Local-cluster convention; PVC storage requests are intentionally unaffected.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-container-resource-sizing
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, daemonsets, statefulsets, jobs, cronjobs]
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, !has(c.resources) ||
          ((!has(c.resources.requests) ||
            (!('cpu' in c.resources.requests) && !('memory' in c.resources.requests))) &&
           (!has(c.resources.limits) ||
            (!('cpu' in c.resources.limits) && !('memory' in c.resources.limits)))))
      message: This local cluster omits CPU/memory requests and limits on containers.
