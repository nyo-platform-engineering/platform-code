apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    platform.local/owner: platform-team
  name: gitlab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/nyo-platform-engineering/platform-code.git
      path: code/infrastructure/charts/gitlab
      targetRevision: main
      helm:
        releaseName: gitlab
        valueFiles:
          - $values/code/infrastructure/argo-apps/platform/03-cd/gitlab/values.yaml
    - repoURL: https://github.com/nyo-platform-engineering/platform-code.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  ignoreDifferences:
    # Kubernetes defaults these embedded PVC type fields; the upstream chart omits them.
    - group: apps
      kind: StatefulSet
      name: gitlab-gitaly
      namespace: gitlab
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[] | .apiVersion | select(. == "v1")'
        - '.spec.volumeClaimTemplates[] | .kind | select(. == "PersistentVolumeClaim")'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
