apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    platform.local/owner: platform-team
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nyo-platform-engineering/platform-code.git
    targetRevision: main
    path: code/infrastructure/argo-apps/platform
    directory:
      recurse: true
      exclude: '{**/manifests/**,**/values.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [ServerSideApply=true]
