labels:
  platform.local/owner: platform-team
env:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector-cluster.monitoring.svc.cluster.local:4318
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: deployment.environment.name=local,k8s.cluster.name=dev,tenant.id=local
image:
  repository: local/go-demo
  tag: dev1
terminationGracePeriodSeconds: 15
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
readinessProbe:
  httpGet:
    path: /readyz
    port: http
livenessProbe:
  httpGet:
    path: /healthz
    port: http
httpRoute:
  enabled: true
  parentRefs:
    - name: local
      namespace: traefik
      sectionName: web
  hostnames: [go.localhost]
