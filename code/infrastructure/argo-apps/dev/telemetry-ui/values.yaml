fullnameOverride: telemetry-ui
podLabels:
  platform.local/owner: platform-team
labels:
  platform.local/owner: platform-team
# Match this local cluster's no CPU/memory sizing convention.
resources:
  requests:
    cpu: null
    memory: null
  limits:
    memory: null
clickhouse:
  type: unified
  unified:
    address: clickhouse.monitoring.svc.cluster.local:9000
    username: app
    passwordSecret:
      name: telemetry-ui-clickhouse
      key: password
httpRoute:
  enabled: true
  parentRefs:
    - name: local
      namespace: traefik
      sectionName: web
  hostnames: [telemetry.localhost]
extraEnv:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector-cluster.monitoring.svc.cluster.local:4318
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: deployment.environment.name=local,k8s.cluster.name=dev,tenant.id=local
