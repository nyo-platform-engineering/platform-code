# Runtime AAT lokal; batas memori mengikuti Lampiran B M2.
fullnameOverride: auth
replicaCount: 1
containerPorts:
- name: http
  containerPort: 8084
  protocol: TCP
service:
  enabled: true
  ports:
  - name: http
    port: 8084
    targetPort: http
    protocol: TCP
    nodePort: 30084
  type: NodePort
readinessProbe:
  httpGet:
    path: /health
    port: http
livenessProbe:
  tcpSocket:
    port: http
startupProbe:
  tcpSocket:
    port: http
  failureThreshold: 30
  periodSeconds: 5
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 256Mi
image:
  repository: ghcr.io/yonatan-nyo/aat-apps/auth
volumes:
- name: tmp
  emptyDir: {}
volumeMounts:
- name: tmp
  mountPath: /tmp
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
podLabels:
  role: api
config:
  ACCESS_TTL_SECONDS: '60'
  REFRESH_TTL_SECONDS: '3600'
  AUTH_MAX_SESSIONS: '1000'
  AUTH_MAX_CONCURRENT: '32'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-cluster.monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAME: auth
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=sistem-informasi-kebencanaan-bnpb
env:
- name: AUTH_INTERNAL_TOKEN
  valueFrom:
    secretKeyRef:
      name: aat-runtime
      key: AUTH_INTERNAL_TOKEN
- name: PUBLIC_CLIENT_SECRET
  valueFrom:
    secretKeyRef:
      name: aat-runtime
      key: PUBLIC_CLIENT_SECRET
- name: RESPONDER_CLIENT_SECRET
  valueFrom:
    secretKeyRef:
      name: aat-runtime
      key: RESPONDER_CLIENT_SECRET
- name: ANALYST_CLIENT_SECRET
  valueFrom:
    secretKeyRef:
      name: aat-runtime
      key: ANALYST_CLIENT_SECRET
