# Runtime AAT lokal; batas memori mengikuti Lampiran B M2.
fullnameOverride: aggregator
replicaCount: 3
# Allow endpoint removal to reach Traefik before the server shuts down.
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5"]
containerPorts:
  - name: http
    containerPort: 8083
    protocol: TCP
service:
  enabled: true
  ports:
    - name: http
      port: 8083
      targetPort: http
      protocol: TCP
  type: ClusterIP
readinessProbe:
  httpGet:
    path: /health
    port: http
livenessProbe:
  tcpSocket:
    port: http
startupProbe:
  tcpSocket:
    port: http
  failureThreshold: 30
  periodSeconds: 5
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
image:
  repository: ghcr.io/yonatan-nyo/aat-apps/aggregator
volumes:
  - name: tmp
    emptyDir: {}
  - name: citus
    configMap:
      name: aat-citus
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: citus
    mountPath: /etc/citus
    readOnly: true
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
podLabels:
  role: aggregator
config:
  STORE_BACKEND: citus
  CITUS_MEMBERS_FILE: /etc/citus/members.json
  BMKG_URL: http://bmkg:8081
  PVMBG_URL: http://pvmbg:8082
  NATS_URL: nats://nats:4222
  # 5 source/background sessions + 1 shared read slot + READ_PRIORITY_SLOTS. Five
  # replicas use at most 35 of the 50 coordinator connections, leaving room for Citus/Patroni.
  DB_MAX_CONNS: "7"
  # Read slot per pod kept for Field Team/BNPB Internal reads (X-Read-Class: priority).
  READ_PRIORITY_SLOTS: "1"
  # Shared hazards/analytics token bucket per pod, identical at every replica count.
  READ_RPS_LIMIT: "20"
  READ_RPS_BURST: "5"
  POLL_INTERVAL_SECONDS: "3"
  POLL_TIMEOUT_MS: "4000"
  PVMBG_SCHEMA_POLICY: strict
  FIELD_REPORT_PROCESSOR_ENABLED: 'true'
  SATELLITE_FEED_URL: https://satellite.naufarrel.dev
  SATELLITE_ALLOWED_LATENESS_MINUTES: "360"
  SATELLITE_BATCH_SIZE: "200"
  SENSOR_PANTAI_URL: http://sensor-pantai:8080
  SENSOR_POLL_INTERVAL_MS: "1000"
  SENSOR_TIMEOUT_MS: "2000"
  SENSOR_STALE_AFTER_SECONDS: "900"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-cluster.monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAME: aggregator
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=sistem-informasi-kebencanaan-bnpb
env:
  - name: AUDIT_TOKEN
    valueFrom:
      secretKeyRef:
        name: aat-runtime
        key: AUDIT_TOKEN
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: aat-runtime
        key: DATABASE_URL
  - name: AGGREGATOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: aat-runtime
        key: AGGREGATOR_TOKEN
  - name: BMKG_API_KEY
    valueFrom:
      secretKeyRef:
        name: aat-runtime
        key: BMKG_API_KEY
  - name: PVMBG_TOKEN
    valueFrom:
      secretKeyRef:
        name: aat-runtime
        key: PVMBG_TOKEN
  # Token Sensor Pantai milik kelompok, dibuat task up; tanpa key ini poller sensor tidak berjalan.
  - name: PANTAI_AUTH_TOKEN
    valueFrom:
      secretKeyRef:
        name: aat-runtime
        key: PANTAI_AUTH_TOKEN
        optional: true
  # Token grup Feed Satelit dari asisten; tambahkan ke .env.runtime lalu jalankan task up.
  # Tanpa key ini consumer satelit tidak berjalan dan service lain tetap normal.
  - name: SATELLITE_GROUP_TOKEN
    valueFrom:
      secretKeyRef:
        name: aat-runtime
        key: SATELLITE_GROUP_TOKEN
        optional: true
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    # Spread each revision independently while old pods drain during rollout.
    matchLabelKeys: [pod-template-hash]
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: aggregator
