# Runtime AAT lokal; batas memori mengikuti Lampiran B M2.
fullnameOverride: client
replicaCount: 3
containerPorts:
- name: http
  containerPort: 8080
  protocol: TCP
service:
  enabled: true
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
    nodePort: 30080
  type: NodePort
  # A node's public entrypoint serves its local replica, avoiding a dead remote node.
  externalTrafficPolicy: Local
readinessProbe:
  httpGet:
    path: /health
    port: http
livenessProbe:
  tcpSocket:
    port: http
startupProbe:
  tcpSocket:
    port: http
  failureThreshold: 30
  periodSeconds: 5
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
image:
  repository: ghcr.io/yonatan-nyo/aat-apps/client
volumes:
- name: tmp
  emptyDir: {}
volumeMounts:
- name: tmp
  mountPath: /tmp
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
podLabels:
  role: api
config:
  AUTH_URL: http://auth:8084
  AGGREGATOR_URL: http://aggregator:8083
  CLIENT_MAX_CONCURRENT: '16'
  # 20% of 16 = 3 Media requests: the Aggregator's 3 shared read slots (1 per pod).
  CLIENT_MEDIA_SHARE_PERCENT: '20'
  CLIENT_IDENTITY_CACHE_SECONDS: '10'
  UPSTREAM_TIMEOUT_MS: '3000'
  STALE_AFTER_SECONDS: '60'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-cluster.monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAME: client
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=sistem-informasi-kebencanaan-bnpb
env:
- name: AUTH_INTERNAL_TOKEN
  valueFrom:
    secretKeyRef:
      name: aat-runtime
      key: AUTH_INTERNAL_TOKEN
- name: AGGREGATOR_TOKEN
  valueFrom:
    secretKeyRef:
      name: aat-runtime
      key: AGGREGATOR_TOKEN

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    matchLabelKeys: [pod-template-hash]
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: client
