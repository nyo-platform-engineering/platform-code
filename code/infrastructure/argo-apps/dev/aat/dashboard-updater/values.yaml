# Runtime AAT lokal; batas memori mengikuti Lampiran B M2.
fullnameOverride: dashboard-updater
replicaCount: 1
containerPorts:
- name: http
  containerPort: 8085
  protocol: TCP
service:
  enabled: true
  ports:
  - name: http
    port: 8085
    targetPort: http
    protocol: TCP
  type: ClusterIP
readinessProbe:
  httpGet:
    path: /health
    port: http
livenessProbe:
  tcpSocket:
    port: http
startupProbe:
  tcpSocket:
    port: http
  failureThreshold: 30
  periodSeconds: 5
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
image:
  repository: ghcr.io/yonatan-nyo/aat-apps/dashboard-updater
volumes:
- name: tmp
  emptyDir: {}
volumeMounts:
- name: tmp
  mountPath: /tmp
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
podLabels:
  role: consumer
config:
  NATS_URL: nats://nats:4222
  PORT: '8085'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-cluster.monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAME: dashboard-updater
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=sistem-informasi-kebencanaan-bnpb
env: []
